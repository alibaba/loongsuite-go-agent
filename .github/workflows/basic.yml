# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Basic

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual trigger'
        required: false
        type: environment
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'test/**'
      - 'pkg/**'
      - 'tool/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'test/**'
      - 'pkg/**'
      - 'tool/**'
  schedule:
    # daily at 3:24 UTC
    - cron: '24 3 * * *'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # If you want to matrix build , you can append the following list.
      matrix:
        # Go 1.24 is kept deliberately: modules declare `go 1.25.0` (required by
        # OTel >= 1.42), so a 1.24 runner exercises the GOTOOLCHAIN=auto upgrade
        # path that users on 1.24 rely on. Go 1.26 is held back until
        # bytedance/sonic >= v1.15.0 is picked up - v1.14.1 gates GoMapIterator
        # behind !go1.26, which breaks the eino and hertz builds.
        # See https://github.com/bytedance/sonic/issues/895
        go_version:
          - 1.24
          - 1.25
        os:
          - ubuntu-latest
          - windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}

    - name: Build
      run: make build
    - name: InstUt
      run: cd pkg && go test -a -v ./inst-api/... ./inst-api-semconv/... ./sdkconfig/... ./testaccess/... -coverprofile=coverage.txt -covermode=atomic
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Test
      run: go test -short -timeout 50m -v -run='.*Test[^Plugins|Latest|Muzzle].*' github.com/alibaba/loongsuite-go/test
