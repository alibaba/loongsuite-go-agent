# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Latest

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'test/**'
      - 'pkg/**'
      - 'tool/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'test/**'
      - 'pkg/**'
      - 'tool/**'
      - '.github/workflows/**'

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version:
          - 1.24
          - 1.25
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}

    - name: Build
      run: make build

    - name: Clean Go Caches
      run: |
        go clean -cache
        go clean -modcache

    - name: Test
      run: go test -timeout 50m -v github.com/alibaba/loongsuite-go/test -run "TestLatest3"
